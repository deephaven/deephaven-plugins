[metadata]
name = deephaven-sample-data
description = Deterministic sample datasets for Deephaven
long_description = file: README.md
long_description_content_type = text/markdown
version = 0.1.0.dev0
url = https://github.com/deephaven/deephaven-plugins
project_urls =
    Source Code = https://github.com/deephaven/deephaven-plugins
    Bug Tracker = https://github.com/deephaven/deephaven-plugins/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering
    Development Status :: 3 - Alpha
keywords = deephaven, sample, data, example
author = Devin Smith, Vlad Babich, Joe Numainville
author_email = josephnumainville@deephaven.io
platforms = any

[options]
package_dir=
    =src
packages=find_namespace:
install_requires =
    deephaven-core>=42.2
    plotly>=5.0.0
    pandas
    numpy
    jpy
include_package_data = True

[options.packages.find]
where=src
