[tox]
isolated_build = True

[testenv]
deps =
    deephaven-server
    # Install the in-repo sample data package so unreleased changes are tested together
    {toxinidir}/../sample-data
commands =
    python -m unittest discover
basepython = python3.9

[testenv:py3.9]
basepython = python3.9

[testenv:py3.10]
basepython = python3.10

[testenv:py3.11]
basepython = python3.11

[testenv:py3.12]
basepython = python3.12

[testenv:py3.13]
basepython = python3.13