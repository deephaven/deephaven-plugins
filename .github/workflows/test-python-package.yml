name: Test Python Package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string

jobs:
  # Some plugins are JS-only and have no Python side (no tox.ini). They still
  # flow through the changed-packages matrix, so skip the Python tests for them.
  check-tox:
    runs-on: ubuntu-24.04
    outputs:
      files_exists: ${{ steps.check_files.outputs.files_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check file existence
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: 'plugins/${{ inputs.package }}/tox.ini'

  test:
    needs: check-tox
    if: ${{ needs.check-tox.outputs.files_exists == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install tox
        run: pip install tox
        working-directory: 'plugins/${{ inputs.package }}'

      - name: Run tox
        run: tox -e py${{ matrix.python }}
        working-directory: 'plugins/${{ inputs.package }}'
